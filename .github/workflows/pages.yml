# Presentation site (site/) published on GitHub Pages: https://ranglier.github.io/Maze/
# Static files, no build step; the screenshots in site/img/ are committed (site/tools/capture.mjs, run by hand).
# One-time setting: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read    # checkout
  pages: write      # deploy to Pages
  id-token: write   # prove the deployment comes from this workflow

# One deployment at a time; a run in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
